<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fixtures — Tristar Sports & Fitness</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#ff6a00" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link rel="icon" type="image/png" href="./icons/favicon-32.png" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/sport-themes.css" />
</head>
<body data-page="fixtures">
  <header class="app-header">
    <div class="brand">
      <img class="brand-logo" src="./icons/icon-192.png" alt="Tristar Sports & Fitness logo" />
      <span class="brand-name">Tristar Sports &amp; Fitness</span>
    </div>
    <nav>
      <a href="./fixtures.html" class="active">Fixtures</a>
      <a href="./live.html">Live Scores</a>
      <a href="./register.html">Register</a>
      <a href="./admin.html">Admin</a>
    </nav>
  </header>

  <main class="container">
    <div class="filter-bar">
      <select id="filter-sport"></select>
      <select id="filter-category"></select>
      <div class="chips">
        <button data-status-chip="scheduled">Upcoming</button>
        <button data-status-chip="live">Live</button>
        <button data-status-chip="completed">Completed</button>
      </div>
    </div>

    <div id="fixtures-list" class="card-grid"></div>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
