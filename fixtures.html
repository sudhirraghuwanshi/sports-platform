<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fixtures — Sports Platform</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#1f6feb" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/sport-themes.css" />
</head>
<body data-page="fixtures">
  <header class="app-header">
    <h1>🏆 Sports Platform</h1>
    <nav>
      <a href="./fixtures.html" class="active">Fixtures</a>
      <a href="./live.html">Live Scores</a>
      <a href="./admin.html">Admin</a>
    </nav>
  </header>

  <main class="container">
    <div class="filter-bar">
      <select id="filter-sport"></select>
      <select id="filter-category"></select>
      <div class="chips">
        <button data-status-chip="scheduled">Upcoming</button>
        <button data-status-chip="live">Live</button>
        <button data-status-chip="completed">Completed</button>
      </div>
    </div>

    <div id="fixtures-list" class="card-grid"></div>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
